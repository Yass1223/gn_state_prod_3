# Label-aware trajectory refinement, run between `jersey_number_detect` and
# `role_team`: the pipeline's ONE merge, on evidence that does not exist at
# tracklet_split's position -- the TEAM CLUSTER id (team_embed), the
# jersey number with its pooled maxconf candidate statistics (jn_gsr_api), and
# exit/entry geometry. Roles and team sides do NOT exist yet: they are
# assigned after this stage, on the finished trajectories.
#
# GHOST RULE: multi-crop detections enter no merge condition -- no centroid
# (centroids are means over CLEAN detections only, no fallback), no re-enter
# anchor, no disjointness test. They follow their fragment through every
# merge; the one exception is stage 3 (final-trajectory duplicate resolution),
# which places them by appearance, no-overlap, with dynamic centroids.
#
# Method (sn_gamestate/refine/traj_refine.py): THREE PHASES over a partition
# of the fragments by label knowledge -- S1: cluster AND number known; S2:
# cluster known, number unknown; a fragment with NO cluster id never merges.
# Phase S1 merges trajectory pairs with EQUAL cluster and EQUAL number, in
# descending order of the pair's joint maxconf score, when their clean frame
# sets are disjoint and their exit/entry sides are consistent -- NO distance
# threshold (the two labels together already identify one player); a pair
# claiming one number at the SAME time is a conflict, resolved by reassigning
# the lower-maxconf side to its best remaining jersey candidate (an unnumbered
# loser leaves S1 and joins S2). Phase S2 merges agglomeratively (average
# linkage) within S2 under equal cluster, clean-frame disjointness and
# re-enter, distance <= tau. The FINAL phase pools ALL S1 and S2 survivors,
# merged and unmerged alike, and merges agglomeratively under clean-frame
# disjointness, re-enter, the SAME cluster id and no contradicting numbers
# (two different known numbers never merge), distance <= tau.
# EVERY fragment is in scope (there is no role to exempt anyone). After the
# merge the fragment-level team embeddings are dropped: trajectories carry the
# jersey evidence only (team_embedding cleared; team_cluster /
# team_cluster_nearest kept as inert snapshots), and the role_team stage
# recomputes appearance from clean crops.
#
# The incoming ids and jersey columns are snapshotted per row
# (track_id_prerefine, jersey_number_detection_prerefine,
# jersey_number_confidence_prerefine) so the audit holds every earlier stage
# to the state it actually produced -- the pattern pitch_gate uses with
# track_id_pregate. `enabled: false` keeps the snapshots and the sidecar but
# changes nothing: the attribution switch for A/B metric runs.
#
# Appearance: the tracker's OSNet-AIN, built from the shared module
# sn_gamestate/reid/osnet_ain.py with the SAME checkpoint pin as
# modules/track/botsort_ain.yaml and modules/tracklet_split/tracklet_split.yaml, so
# tau keeps the cosine-distance scale that operating point was tuned on. The run
# audit fails the run on any pin mismatch against tracklet_split.
_target_: sn_gamestate.refine.traj_refine_api.TrajRefine
cfg:
  # OSNet-AIN checkpoint -- SAME coordinates and digest as modules/track/botsort_ain.yaml
  # and modules/tracklet_split/tracklet_split.yaml.
  ain_repo: Ynniss/osnet_ain
  ain_file: best_ain_full.zip
  ain_revision: d78f65ded828f0cbd8dff2a06dcbff4fc6835dfe
  ain_sha256: a0a7e42676edad0cbc3a4ba0f7d0f8ded75612443ef7a9eabb57cb9e5e245293
  # As in the track config: set this to read the checkpoint from disk instead of
  # the Hub. Keep it in step with the tracker's value.
  ain_local_path: null

  # Master switch. false = snapshots + sidecar only, detections unchanged
  # (for measuring this stage's metric contribution on the same run).
  enabled: true

  # Merge acceptance threshold on the appearance distance (1 - dot of mean unit
  # vectors over clean detections), phases S2 and FINAL (phase S1 is
  # label-driven and carries no threshold). The pipeline's ONLY merge
  # threshold (the splitter never merges). 0.60 is inherited from the retired
  # split_merge stage's notebook-validated operating point; NOT re-tuned for
  # this stage on any validation split yet.
  tau: 0.60

  # Re-enter condition (C3), NEAREST-SIDE rule: when one trajectory ends before
  # the other begins, the earlier one's exit side is the lateral image edge its
  # last single box is CLOSER to, the later one's entry side the edge its first
  # single box is closer to; the sides must match. A side is always defined --
  # there is no touch threshold; edge_margin is accepted for compatibility and
  # unused.
  use_reenter: true
  edge_margin: 0.02

  # NOTE: the two-different-assistants rule (two trajectories satisfying the
  # assistant conditions with opposite mean-y signs, close in appearance) is
  # NOT a merge condition -- it is decided by the role_team stage on the
  # final trajectories.

  # Scope: EVERY fragment. Roles do not exist at this point (role_team runs
  # after this stage), so there is no exemption; the merge conditions are the
  # team cluster (team_embed, REQUIRED -- an unclustered fragment never
  # merges) and the jersey number.

  batch_size: 64      # crops per appearance forward pass

  # Per-sequence sidecar (settings, embedder digest, partition counts,
  # merge/conflict/rejection log of the three phases, per-cluster breakdown)
  # read by the `audit` stage.
  audit_dir: ${project_dir}/audit/traj_refine
