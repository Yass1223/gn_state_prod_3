# Role (player / goalkeeper / referee) and team SIDE (left / right) per FINAL
# trajectory. Runs AFTER traj_refine -- roles and sides are decided once, on
# complete trajectories with full temporal and positional evidence, and never
# gate the merge. The fragment-level team embeddings are dropped by
# traj_refine (team_cluster / team_cluster_nearest remain as inert snapshots
# and are NOT read here): this stage recomputes appearance ITSELF from the
# clean (single) crops of each trajectory.
#
# GHOST RULE (computation): every statistic, every candidate condition and the
# appearance descriptor use SINGLE (crop_single) detections only. Multi-crop
# rows contribute nothing to any decision; once the trajectory's role and team
# are decided they are WRITTEN on all of its rows (single and multi), so the
# final trajectories are fully labelled for the evaluation and the display.
#
# Rules (sn_gamestate/team/role_team_api.py):
# * one appearance descriptor per trajectory (osnet_team on <= crops_per_track
#   sampled single crops, L2-normalised median); per-trajectory geometry
#   (mean/std x and y, q75 |x|, y-range) and the sampled position count n
#   over the SINGLE detections on the stride grid; the trajectory's jersey
#   number read from jersey_number_detection (written by traj_refine);
# * APPEARANCE OUTLIERS over the descriptors by MUTUAL REACHABILITY of the
#   team clusters (appearance_outliers_plain_v2 -- ONE rule replacing the
#   previous MAD-threshold and DBSCAN channels; sole parameter link_k):
#   2-means supplies the assignment and the centroid distances d; per team
#   the CORE holds the members with d <= median + MAD (floored) -- the
#   certain team members, inliers by definition; each tracklet gets its own
#   RADIUS R_i = median + MAD (floored) of its link_k nearest-neighbour
#   distances; tracklets i, j are MUTUALLY COMPATIBLE iff
#   ||z_i - z_j|| <= min(R_i, R_j); a trajectory is an OUTLIER iff no chain
#   of mutually compatible tracklets links it to either core. Skipped
#   (nothing flagged) when n_desc <= link_k + 1; the flagged trajectories
#   are grouped in the sidecar;
# * ASSISTANTS FIRST, by the touchline geometry (|mean y| >= tau_a * clip max,
#   y-std <= tau_a_sy; candidates must carry a descriptor and have NO jersey
#   number -- there is NO sampled-position threshold on assistants; one per
#   side, so up to TWO assistants with opposite mean-y signs),
#   GEOMETRY FIRST, no outlier condition on acceptance: the geometric best
#   (largest |mean y|) wins outright when it leads the runner-up by >=
#   a_tie_m; otherwise, over the tied set, the trajectory farthest from
#   both 2-means centroids when none is outlier-flagged, else the
#   geometric best among the flagged (farthest among them on a second
#   tie); a flagged winner leaves the outlier pool (geometry wins);
# * GOALKEEPERS by penalty-area depth (q75 |x| >= PEN_X, |mean y| <= PEN_Y)
#   AND relative depth |mean x| > gk_rel * max |mean x| over all trajectories
#   EXCEPT the assistant referees (assistants are assigned first, which is
#   why), with at least min_n sampled positions (candidates must carry a
#   descriptor; EXACTLY ONE per half, no second-keeper confirmation channel),
#   same geometry-first tie rule on depth |mean x| with margin gk_depth_m;
# * MAIN referee = among the remaining OUTLIERS with NO jersey number and at
#   least min_n sampled positions, those whose sampled y-range
#   stays inside the symmetric band of the trajectory means (rule 2.14:
#   max(y_ref) <= band * max_i(mean_y_i) and min(y_ref) >= band *
#   min_i(mean_y_i)), the candidate closest IN APPEARANCE to the assistants;
#   with no assistant, the outlier farthest from both k-means centroids;
# * everyone else a player (a leftover outlier stays a player); sides: 2-means
#   refit on the clean player descriptors, clusters named left/right by the
#   cue chain over player mean-x (side_rule; the quantile cue averages the
#   20 % / 80 % percentiles); a player with no descriptor takes its mean-x
#   half (flagged fallback).
#
# tau_a / tau_a_sy / link_k / band / gk_depth_m /
# a_tie_m / min_n / gk_rel are UNTUNED on this pipeline's trajectories:
# sweep on valid later.
_target_: sn_gamestate.team.RoleTeamAssignment
cfg:
  # osnet_team checkpoint -- SAME coordinates as modules/team_embed/osnet_team.yaml
  # (the digest each stage loads is logged and recorded in its sidecar).
  team_repo: Ynniss/osnet_team
  team_file: osnet_team_best.pt
  team_revision: null       # Hub revision (commit sha) to pin; null = main
  team_sha256: null         # enforced when set; null = recorded only
  team_local_path: null     # read the checkpoint from disk (e.g. a Kaggle dataset) instead
  pos_stride: 5             # frames between sampled positions / crops (notebook POS_STRIDE)
  crops_per_track: 16       # crops embedded per trajectory (notebook CROPS_PER_TRK)
  batch_size: 128           # crops per forward pass
  audit_dir: ${project_dir}/audit/role_team
  params:
    link_k: 4             # neighbour count of the mutual-reachability outlier rule (its ONE parameter)
    tau_a: 0.9            # assistant: |mean y| >= tau_a * clip max |mean y|
    tau_a_sy: 3.0         # assistant: max y std (m)
    side_rule: keeper     # keeper | vote (others fall back to vote)
    band: 0.9             # the symmetric 90% band of rule 2.14
    gk_depth_m: 2.0       # goalkeeper geometry tie margin on depth |mean x| (m)
    a_tie_m: 1.5          # assistant geometry tie margin on |mean y| (m)
    min_n: 10             # min sampled SINGLE positions for goalkeeper / main-referee candidacy (~2 s at stride 5; assistants have no such threshold)
    gk_rel: 0.85          # goalkeeper: |mean x| > gk_rel * max |mean x| over non-assistant trajectories
